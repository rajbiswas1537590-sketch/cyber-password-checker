
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CyberShield | Password Checker</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background: #080f1c;
  color: #e5edf7;
  font-family: Arial, sans-serif;
  display: grid;
  place-items: center;
  padding: 20px;
}
.card {
  background: #111d30;
  border: 1px solid #30445b;
  border-radius: 18px;
  padding: 25px;
  width: 100%;
  max-width: 430px;
}
h1 { color: #36efad; margin-bottom: 8px; }
p { color: #aabbd0; line-height: 1.5; }
input {
  width: 100%;
  padding: 14px;
  background: #081321;
  color: white;
  border: 1px solid #50647a;
  border-radius: 9px;
  font-size: 16px;
}
button {
  margin-top: 12px;
  padding: 11px 16px;
  background: #36efad;
  border: 0;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
}
.meter {
  background: #344356;
  height: 12px;
  border-radius: 8px;
  margin-top: 20px;
  overflow: hidden;
}
#bar {
  height: 100%;
  width: 0%;
  background: #f87171;
  transition: width .2s;
}
li { margin: 9px 0; }
small { color: #9eb0c5; }
</style>
</head>
<body>
<main class="card">
  <h1>🛡 CyberShield</h1>
  <p>Password Security Analyzer</p>
  <p><small>For privacy, use a fictional test password.
  Nothing is uploaded or saved by this page.</small></p>

  <label for="password">Test password</label>
  <input id="password" type="password"
         placeholder="Enter test password"
         autocomplete="off" spellcheck="false">

  <button id="toggle" type="button">Show password</button>

  <div class="meter"><div id="bar"></div></div>
  <h2 id="result" aria-live="polite">Enter a password</h2>
  <p id="score"></p>
  <ul id="tips"></ul>

  <small>This is an educational heuristic,
  not a guarantee of password security.</small>
</main>

<script>
const input = document.getElementById("password");
const bar = document.getElementById("bar");
const result = document.getElementById("result");
const scoreText = document.getElementById("score");
const tips = document.getElementById("tips");
const toggle = document.getElementById("toggle");

toggle.addEventListener("click", () => {
  const visible = input.type === "password";
  input.type = visible ? "text" : "password";
  toggle.textContent = visible ? "Hide password" : "Show password";
});

input.addEventListener("input", () => {
  const p = input.value;
  let score = 0;
  const advice = [];

  if (!p) {
    bar.style.width = "0%";
    result.textContent = "Enter a password";
    scoreText.textContent = "";
    tips.replaceChildren();
    return;
  }

  if (p.length >= 12) score++;
  else advice.push("Use at least 12 characters.");

  if (p.length >= 16) score++;
  else advice.push("Aim for 16+ characters.");

  if (/[a-z]/.test(p) && /[A-Z]/.test(p)) score++;
  else advice.push("Consider mixed-case letters.");

  if (/[0-9]/.test(p)) score++;
  else advice.push("Consider adding numbers.");

  if (/[^a-zA-Z0-9]/.test(p)) score++;
  else advice.push("Consider adding symbols.");

  const common = [
    "password", "123456", "qwerty",
    "admin", "letmein"
  ];

  const predictable = common.some(word =>
    p.toLowerCase().includes(word)
  );

  if (predictable) {
    score = Math.min(score, 1);
    advice.push("Avoid common or predictable patterns.");
  }

  bar.style.width = (score * 20) + "%";
  bar.style.background =
    score <= 2 ? "#f87171" :
    score === 3 ? "#fbbf24" : "#36efad";

  result.textContent =
    score <= 2 ? "Weak" :
    score === 3 ? "Moderate" :
    "Strong by basic rules";

  scoreText.textContent = "Rule score: " + score + "/5";
  tips.replaceChildren();

  advice.push("Use a unique, unpredictable password.");

  advice.forEach(message => {
    const li = document.createElement("li");
    li.textContent = message;
    tips.appendChild(li);
  });
});
</script>
</body>
</html>
